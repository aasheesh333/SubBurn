name: Build

# Builds a signed release APK and AAB on every push, and exposes both as
# downloadable artifacts. Tests live in `.github/workflows/ci.yml` so this
# pipeline stays as short as possible.
on:
  push:
  workflow_dispatch:

# A new push cancels the previous build for the same ref instead of queueing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"
  # Keystore is written here from secrets; the path must match key.properties.
  KEYSTORE_PATH: keystore/subburn-release.jks

jobs:
  # ---------------------------------------------------------------------------
  # APK: arm64 only. One ABI is ~3× faster than a universal build and covers
  # every phone sold in the last several years. Flip `--target-platform` if you
  # need x86_64 for an emulator.
  # ---------------------------------------------------------------------------
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Caches the Gradle user home between runs; the second build is minutes
      # faster than the first.
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — building with the debug key."
            exit 0
          fi
          mkdir -p flutter/android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "flutter/android/$KEYSTORE_PATH"
          cat > flutter/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          echo "Keystore restored."

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build APK
        working-directory: flutter
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" \
            --build-number "${{ github.run_number }}"

      - name: Name the artifact
        run: |
          mkdir -p out
          cp flutter/build/app/outputs/flutter-apk/app-release.apk \
             "out/SubBurn-${GITHUB_SHA::7}-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SubBurn-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # AAB: the Play Store upload artifact. Runs in parallel with the APK job, so
  # wall-clock time is the slower of the two, not the sum.
  # ---------------------------------------------------------------------------
  aab:
    name: Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — building with the debug key."
            exit 0
          fi
          mkdir -p flutter/android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "flutter/android/$KEYSTORE_PATH"
          cat > flutter/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          echo "Keystore restored."

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build AAB
        working-directory: flutter
        run: |
          flutter build appbundle --release \
            --build-name "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" \
            --build-number "${{ github.run_number }}"

      - name: Name the artifact
        run: |
          mkdir -p out
          cp flutter/build/app/outputs/bundle/release/app-release.aab \
             "out/SubBurn-${GITHUB_SHA::7}.aab"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SubBurn-aab-${{ github.sha }}
          path: out/*.aab
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Adds a short summary to the run page with direct links to both artifacts.
  # ---------------------------------------------------------------------------
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [apk, aab]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## SubBurn build \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| Artifact | Status |"
            echo "|---|---|"
            echo "| APK (arm64) | ${{ needs.apk.result }} |"
            echo "| AAB (Play upload) | ${{ needs.aab.result }} |"
            echo ""
            echo "Download them from the **Artifacts** section of this run."
            echo "Retention: 30 days."
          } >> "$GITHUB_STEP_SUMMARY"