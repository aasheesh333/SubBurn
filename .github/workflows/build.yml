name: Build

# Signed release APK + AAB on every push, both downloadable as artifacts.
# Tests run separately in `.github/workflows/ci.yml` so this stays fast.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release APK (arm64)
            task: apk
            flags: --target-platform android-arm64
            artifact: SubBurn-apk
            output: flutter/build/app/outputs/flutter-apk/app-release.apk
            ext: apk
          - label: Release AAB (Play)
            task: appbundle
            flags: ""
            artifact: SubBurn-aab
            output: flutter/build/app/outputs/bundle/release/app-release.aab
            ext: aab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set - building with the debug key"
            exit 0
          fi
          mkdir -p flutter/android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/keystore/subburn-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/subburn-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > flutter/android/key.properties
          echo "keystore restored: $(wc -c < flutter/android/keystore/subburn-release.jks) bytes"

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build ${{ matrix.ext }}
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          # Keep the public versionName from pubspec; only the versionCode is
          # driven by CI so every upload to Play is monotonic.
          flutter build ${{ matrix.task }} --release ${{ matrix.flags }} \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mkdir -p out
          cp "${{ matrix.output }}" "out/SubBurn-${SHORT_SHA}.${{ matrix.ext }}"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30