name: Build

# Signed release APK + AAB on every push, both downloadable as artifacts.
# Tests run separately in `.github/workflows/ci.yml` so this stays fast.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set - building with the debug key"
            exit 0
          fi
          mkdir -p flutter/android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/keystore/subburn-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/subburn-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > flutter/android/key.properties
          echo "keystore restored"

      - name: Dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build APK
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp flutter/build/app/outputs/flutter-apk/app-release.apk \
             "out/SubBurn-${GITHUB_SHA:0:7}-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SubBurn-apk-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  aab:
    name: Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set - building with the debug key"
            exit 0
          fi
          mkdir -p flutter/android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/keystore/subburn-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/subburn-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > flutter/android/key.properties
          echo "keystore restored"

      - name: Dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build AAB
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp flutter/build/app/outputs/bundle/release/app-release.aab \
             "out/SubBurn-${GITHUB_SHA:0:7}.aab"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SubBurn-aab-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30